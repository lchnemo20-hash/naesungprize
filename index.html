  let mode='penalty'; $('mode').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.mode;$('mode').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));};
  renderRecords=()=>{const list=records(),sum=list.reduce((a,p)=>a+p.points,0);$('total').textContent=(sum>0?'+':'')+sum+'점';$('records').innerHTML=list.length?list.slice().reverse().map(p=>`<div class="record"><span class="score ${p.points>0?'plus':''}">${p.points>0?'+':''}${p.points}</span><div class="detail"><b>${esc(p.type)}</b>${p.note?' · '+esc(p.note):''}<small>${p.date} · ${esc(p.teacher||'교사 미입력')}</small></div><button class="delete" data-key="${p.key}" aria-label="기록 삭제">×</button></div>`).join(''):'<div class="empty">아직 기록된 기록이 없습니다.</div>';$('records').querySelectorAll('.delete').forEach(b=>b.onclick=()=>{penalties=penalties.filter(p=>p.key!==b.dataset.key);save();renderRecords();toast('기록을 삭제했습니다.')})};
  const syncLogin=()=>{const name=localStorage.getItem(LOGIN)||'';$('teacher').value=name;$('teacher').readOnly=!!name;$('login').style.display=name?'none':'';$('logout').style.display=name?'':'none'};const home=()=>{$('detailView').classList.add('hidden');$('searchView').classList.remove('hidden');$('query').value='';$('results').innerHTML='<div class="empty">학번 또는 성명을 입력하면 학생이 표시됩니다.</div>';window.scrollTo(0,0)};$('home').onclick=home;$('login').onclick=()=>{const name=$('teacher').value.trim();if(!name){toast('교사 성명을 입력해 주세요.');$('teacher').focus();return}localStorage.setItem(LOGIN,name);syncLogin();home();toast(name+' 선생님, 로그인되었습니다.')};$('logout').onclick=()=>{localStorage.removeItem(LOGIN);syncLogin();home();toast('로그아웃되었습니다.')};syncLogin();
  $('classSearch').onclick=()=>{const g=$('grade').value,c=$('class').value,scored=new Set(penalties.map(p=>p.id));const found=students.filter(s=>(!g||s.grade===g)&&(!c||s.class===c)&&(g||c||scored.has(s.id)));$('results').innerHTML=found.length?found.map(s=>`<button class="student" data-id="${s.id}"><span><strong>${esc(s.name)}</strong><br><small>${s.id}</small></span><span class="badge">${s.grade}학년 ${s.class}반</span></button>`).join(''):'<div class="empty">상점 또는 벌점 기록이 있는 학생이 없습니다.</div>';$('results').querySelectorAll('.student').forEach(b=>b.onclick=()=>openStudent(b.dataset.id))};
  $('add').onclick=()=>{const teacher=$('teacher').value.trim(), raw=Number($('points').value);if(!teacher){toast('교사 성명을 먼저 입력해 주세요.');$('teacher').focus();return}if(!Number.isInteger(raw)||raw<1){toast('1점 이상의 정수를 입력해 주세요.');return}const now=new Date(),points=mode==='penalty'?-raw:raw;penalties.push({key:Date.now().toString()+Math.random(),id:current.id,type:chosenType,points,note:$('note').value.trim(),teacher,date:now.toLocaleString('ko-KR'),day:now.toISOString().slice(0,10)});save();renderRecords();toast(mode==='penalty'?'벌점이 추가되었습니다.':'상점이 추가되었습니다.')};
  $('penaltySearch').onclick=()=>{const day=$('dateFilter').value,teacher=$('teacherFilter').value.trim(),list=penalties.filter(p=>(!day||p.day===day||p.date.startsWith(day.replaceAll('-','.')))&&(!teacher||(p.teacher||'').includes(teacher))).sort((a,b)=>b.key.localeCompare(a.key));$('penaltyResults').innerHTML=list.length?list.map(p=>{const s=students.find(x=>x.id===p.id)||{name:'알 수 없음',id:p.id},sign=p.points>0?'+':'';return `<div class="record"><span class="score ${p.points>0?'plus':''}">${sign}${p.points}</span><div class="detail"><b>${esc(s.name)} · ${s.id}</b><br>${esc(p.type)} · ${esc(p.teacher||'교사 미입력')}<small>${p.date}${p.note?' · '+esc(p.note):''}</small></div><button class="delete" data-key="${p.key}" aria-label="기록 삭제">×</button></div>`}).join(''):'<div class="empty">조건에 맞는 벌점 기록이 없습니다.</div>';$('penaltyResults').querySelectorAll('.delete').forEach(b=>b.onclick=()=>{penalties=penalties.filter(p=>p.key!==b.dataset.key);save();$('penaltySearch').click();toast('기록을 삭제했습니다.')})};
})();</script><script>
(() => {
  const $=id=>document.getElementById(id), app=document.querySelector('.app'), LOGIN='naeseong_teacher_login_2026';

  $('startLogin').onclick=()=>{const name=$('loginTeacher').value.trim();if(!name){toast('교사 성명을 입력해 주세요.');return}localStorage.setItem(LOGIN,name);showApp();toast(name+' 선생님, 로그인되었습니다.')};
